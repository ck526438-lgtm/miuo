[project]
name = "miuo"
version = "1.0.0"
description = "Bot de trading MT5 qui doit prouver son avantage statistique avant de risquer de l'argent réel"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[project.scripts]
miuo = "miuo.cli:main"

[tool.setuptools]
packages = ["miuo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
